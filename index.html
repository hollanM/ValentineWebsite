<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="cherries">🍒</div>

        <h1>Chloe,</h1> <h1>Will you be my cherry on top?</h1>

        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>

        <p class="note"><em>*No* seems to have rolled off the stem</em></p>
    </div>

    <div id="kermitModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <center><img src="kermit.gif" alt="Kermit celebrating"></center>
            <h1>Kermit approves. My heart approves. The cherries approve</h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
